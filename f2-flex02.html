<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roshan - Split View Layout</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #09090b;
    color: #fafafa;
}

header{
    background: #18181b;
    border-bottom: 1px solid #27272a;
    color: #ffffff;
    padding: 18px 32px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.tag{
    font-size: 12px;
    font-weight: 600;
    color: #f97316;
    background: rgba(249, 115, 22, 0.1);
    border: 1px solid rgba(249, 115, 22, 0.3);
    padding: 4px 10px;
    border-radius: 4px;
}

main{
    flex: 1;
    display: flex;
}

.panel{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    transition: background 0.2s ease;
}

.panel-left{
    background: #09090b;
    border-right: 1px solid #27272a;
}

.panel-right{
    background: #121215;
}

.card{
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 8px;
    padding: 32px;
    text-align: center;
    max-width: 320px;
    width: 100%;
}

.card h2{
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #ffffff;
}

.card p{
    font-size: 14px;
    color: #a1a1aa;
    line-height: 1.5;
}

footer{
    background: #18181b;
    border-top: 1px solid #27272a;
    color: #71717a;
    padding: 14px 32px;
    font-size: 13px;
    text-align: center;
}
</style>
</head>
<body>

<header>
    <div>ROSHAN • DUAL PANEL</div>
    <div class="tag">MATTE BLACK</div>
</header>

<main>
    <div class="panel panel-left">
        <div class="card">
            <h2>Primary Console</h2>
            <p>High performance split viewport architecture with minimal latency.</p>
        </div>
    </div>

    <div class="panel panel-right">
        <div class="card">
            <h2 style="color: #f97316;">Secondary Stream</h2>
            <p>Active output panel synchronized with the main workstation.</p>
        </div>
    </div>
</main>

<footer>
    Roshan Studio • Minimalist Dark Design System
</footer>

</body>
</html>
