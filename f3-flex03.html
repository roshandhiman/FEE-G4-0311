<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Card Component</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .card-wrapper{
            padding: 20px;
        }

        .card{
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
            max-width: 480px;
        }

        .card:hover{
            transform: translateY(-6px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        }

        .card h1{
            font-size: 2.2rem;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .card p{
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .badge{
            display: inline-block;
            margin-top: 20px;
            padding: 6px 16px;
            background: #e0e7ff;
            color: #4338ca;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card">
            <h1>Hello, this is Roshan!</h1>
            <p>Mastering Frontend Engineering, Modern Layouts, and Interactive Web Applications.</p>
            <div class="badge">Roshan Portfolio</div>
        </div>
    </div>
</body>
</html>
