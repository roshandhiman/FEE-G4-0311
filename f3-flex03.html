<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Brutalist Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fed7aa;
            font-family: 'Arial Black', -apple-system, sans-serif;
            padding: 20px;
        }

        .brutal-card{
            background: #ffffff;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0px #000000;
            border-radius: 0px;
            padding: 40px;
            max-width: 440px;
            width: 100%;
            text-align: left;
            position: relative;
        }

        .sticker{
            position: absolute;
            top: -16px;
            right: 20px;
            background: #f97316;
            color: #ffffff;
            border: 3px solid #000000;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 3px 3px 0px #000000;
            transform: rotate(3deg);
        }

        h1{
            font-size: 2rem;
            color: #000000;
            margin-bottom: 12px;
            line-height: 1.1;
        }

        p{
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 1.05rem;
            color: #1f2937;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .btn{
            display: inline-block;
            background: #000000;
            color: #ffffff;
            border: 3px solid #000000;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 900;
            text-decoration: none;
            box-shadow: 4px 4px 0px #f97316;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn:hover{
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #f97316;
        }
    </style>
</head>
<body>
    <div class="brutal-card">
        <div class="sticker">ROSHAN 2026</div>
        <h1>HELLO, I AM ROSHAN!</h1>
        <p>Building clean, responsive, and high-impact web components with CSS Flexbox and modern layout techniques.</p>
        <button class="btn">DISCOVER MORE</button>
    </div>
</body>
</html>
