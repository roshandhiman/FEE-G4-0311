<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan • Frontend Engineering Lab</title>
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-white: #ffffff;
            --primary: #f97316;
            --primary-hover: #ea580c;
            --primary-light: #fff7ed;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-dark: #cbd5e1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            background: var(--bg-white);
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            gap: 12px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: var(--primary);
            color: #ffffff;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-box {
            padding: 7px 12px;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            background: var(--bg-white);
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .select-box:focus {
            border-color: var(--primary);
        }

        .view-tabs {
            display: flex;
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            overflow: hidden;
            background: var(--bg-page);
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 7px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-dark);
            background: var(--bg-white);
            color: var(--text-dark);
            transition: all 0.15s ease;
        }

        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            color: #ffffff;
            border-color: var(--primary-hover);
        }

        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        aside {
            width: 280px;
            background: var(--bg-white);
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .aside-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: transparent;
            color: var(--text-dark);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

        .file-btn:hover {
            background: var(--primary-light);
            border-color: var(--border-dark);
        }

        .file-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: #f1f5f9;
            color: #475569;
        }

        .file-btn.active .tag {
            background: var(--primary);
            color: #ffffff;
        }

        .content-viewer {
            flex: 1;
            background: var(--bg-page);
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .action-bar {
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-bottom: none;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .current-file-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .viewer-box {
            flex: 1;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
            display: block;
        }

        .code-container {
            width: 100%;
            height: 100%;
            background: #1e293b;
            color: #f8fafc;
            padding: 16px;
            overflow: auto;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            display: none;
        }

        @media (max-width: 768px) {
            aside {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <div class="brand-badge">FEE</div>
            <div class="brand-title">Roshanpreet Singh</div>
        </div>

        <div class="nav-center">
            <select class="select-box" id="fileDropdown" onchange="switchFile(this.value)">
                <option value="f1-flex01.html">f1-flex01.html (Flex Layout 1)</option>
                <option value="f2-flex02.html">f2-flex02.html (Split Layout)</option>
                <option value="f3-flex03.html">f3-flex03.html (Card Component)</option>
                <option value="f4-flex04.html">f4-flex04.html (Venn Circles)</option>
                <option value="f5-grid1.html">f5-grid1.html (Grid System)</option>
                <option value="f6-grid2.html">f6-grid2.html (Bento Grid)</option>
                <option value="f7-login.html">f7-login.html (Login Portal)</option>
                <option value="f8-staticPage.html">f8-staticPage.html (Responsive Page)</option>
                <option value="f9-inventory.js">f9-inventory.js (Inventory Code)</option>
                <option value="f10-billing.js">f10-billing.js (Billing Code)</option>
                <option value="f11-text1.txt">f11-text1.txt (Study Notes)</option>
                <option value="f12-navbar.html">f12-navbar.html (Dashboard Layout)</option>
                <option value="f13-grade-calc.html">f13-grade-calc.html (Grade Calculator)</option>
                <option value="f13-main.js">f13-main.js (Async Grade CLI)</option>
                <option value="grade.js">grade.js (Grade Module)</option>
                <option value="style.css">style.css (CSS Utility)</option>
            </select>

            <div class="view-tabs">
                <button class="tab-btn active" id="tabPreview" onclick="setMode('preview')">Live Preview</button>
                <button class="tab-btn" id="tabCode" onclick="setMode('code')">View Code</button>
            </div>
        </div>

        <div class="header-btns">
            <a href="https://github.com/roshandhiman/FEE-G4-0311" target="_blank" class="btn">
                <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                    </path>
                </svg>
                GitHub Repo
            </a>
            <a id="rawLink" href="f1-flex01.html" target="_blank" class="btn">Open New Tab &#8599;</a>
        </div>
    </header>

    <div class="main-content">
        <aside>
            <div class="aside-header">
                <span>Coursework Files</span>
                <span>16 Files</span>
            </div>
            <div class="file-list">
                <button class="file-btn active" data-file="f1-flex01.html" onclick="switchFile('f1-flex01.html')">
                    <span>f1-flex01.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f2-flex02.html" onclick="switchFile('f2-flex02.html')">
                    <span>f2-flex02.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f3-flex03.html" onclick="switchFile('f3-flex03.html')">
                    <span>f3-flex03.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f4-flex04.html" onclick="switchFile('f4-flex04.html')">
                    <span>f4-flex04.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f5-grid1.html" onclick="switchFile('f5-grid1.html')">
                    <span>f5-grid1.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f6-grid2.html" onclick="switchFile('f6-grid2.html')">
                    <span>f6-grid2.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f7-login.html" onclick="switchFile('f7-login.html')">
                    <span>f7-login.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f8-staticPage.html" onclick="switchFile('f8-staticPage.html')">
                    <span>f8-staticPage.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f9-inventory.js" onclick="switchFile('f9-inventory.js')">
                    <span>f9-inventory.js</span>
                    <span class="tag">JS</span>
                </button>
                <button class="file-btn" data-file="f10-billing.js" onclick="switchFile('f10-billing.js')">
                    <span>f10-billing.js</span>
                    <span class="tag">JS</span>
                </button>
                <button class="file-btn" data-file="f11-text1.txt" onclick="switchFile('f11-text1.txt')">
                    <span>f11-text1.txt</span>
                    <span class="tag">TXT</span>
                </button>
                <button class="file-btn" data-file="f12-navbar.html" onclick="switchFile('f12-navbar.html')">
                    <span>f12-navbar.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f13-grade-calc.html" onclick="switchFile('f13-grade-calc.html')">
                    <span>f13-grade-calc.html</span>
                    <span class="tag">HTML</span>
                </button>
                <button class="file-btn" data-file="f13-main.js" onclick="switchFile('f13-main.js')">
                    <span>f13-main.js</span>
                    <span class="tag">JS</span>
                </button>
                <button class="file-btn" data-file="grade.js" onclick="switchFile('grade.js')">
                    <span>grade.js</span>
                    <span class="tag">JS</span>
                </button>
                <button class="file-btn" data-file="style.css" onclick="switchFile('style.css')">
                    <span>style.css</span>
                    <span class="tag">CSS</span>
                </button>
            </div>
        </aside>

        <main class="content-viewer">
            <div class="action-bar">
                <div class="current-file-name" id="currentFileName">f1-flex01.html</div>
                <button class="btn btn-primary" id="copyBtn" onclick="copyCode()">Copy Code</button>
            </div>
            <div class="viewer-box">
                <iframe id="liveFrame" src="f1-flex01.html"></iframe>
                <pre id="codeView" class="code-container"></pre>
            </div>
        </main>
    </div>

    <script>
        let currentFile = 'f1-flex01.html';
        let currentMode = 'preview';
        let fileCache = {};

        function switchFile(fileName) {
            currentFile = fileName;
            document.getElementById('currentFileName').innerText = fileName;
            document.getElementById('fileDropdown').value = fileName;
            document.getElementById('rawLink').href = fileName;

            document.querySelectorAll('.file-btn').forEach(btn => {
                if (btn.getAttribute('data-file') === fileName) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            loadContent();
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('tabPreview').classList.toggle('active', mode === 'preview');
            document.getElementById('tabCode').classList.toggle('active', mode === 'code');
            loadContent();
        }

        function loadContent() {
            const frame = document.getElementById('liveFrame');
            const codeBox = document.getElementById('codeView');
            const isHtml = currentFile.endsWith('.html');

            if (currentMode === 'preview' && isHtml) {
                frame.style.display = 'block';
                codeBox.style.display = 'none';
                frame.src = currentFile;
            } else {
                frame.style.display = 'none';
                codeBox.style.display = 'block';

                if (fileCache[currentFile]) {
                    codeBox.innerText = fileCache[currentFile];
                } else {
                    codeBox.innerText = 'Loading code...';
                    fetch(currentFile)
                        .then(res => res.text())
                        .then(text => {
                            fileCache[currentFile] = text;
                            codeBox.innerText = text;
                        })
                        .catch(err => {
                            codeBox.innerText = 'Error loading source: ' + err.message;
                        });
                }
            }
        }

        function copyCode() {
            const copyBtn = document.getElementById('copyBtn');

            function doCopy(text) {
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.innerText = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy Code';
                    }, 2000);
                });
            }

            if (fileCache[currentFile]) {
                doCopy(fileCache[currentFile]);
            } else {
                fetch(currentFile)
                    .then(res => res.text())
                    .then(text => {
                        fileCache[currentFile] = text;
                        doCopy(text);
                    });
            }
        }

        loadContent();
    </script>
</body>

</html>
