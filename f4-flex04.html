<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Venn Geometry</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #09090b;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .title {
            color: #f97316;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .box {
            background: #18181b;
            border: 1px solid #27272a;
            width: 90%;
            max-width: 600px;
            height: 360px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circles {
            position: relative;
            width: 300px;
            height: 150px;
        }

        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: absolute;
            mix-blend-mode: screen;
            transition: transform 0.25s ease;
        }

        .circle1 {
            left: 0;
            background: rgba(249, 115, 22, 0.75);
        }

        .circle2 {
            left: 150px;
            background: rgba(59, 130, 246, 0.75);
        }

        .circle3 {
            left: 75px;
            background: rgba(236, 72, 153, 0.75);
        }

        .box:hover .circle {
            transform: scale(1.06);
        }
    </style>
</head>
<body>
    <div class="title">Roshan • Venn Intersection System</div>
    <div class="box">
        <div class="circles">
            <div class="circle circle1"></div>
            <div class="circle circle2"></div>
            <div class="circle circle3"></div>
        </div>
    </div>
</body>
</html>
