<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Roshan">
    <meta name="Description" content="Roshan Login Portal">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Brutalist Login</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body{
        min-height: 100vh;
        background: #fff7ed;
        font-family: 'Arial Black', -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-card{
        background: #ffffff;
        border: 4px solid #000000;
        box-shadow: 8px 8px 0px #000000;
        width: 100%;
        max-width: 380px;
        padding: 36px 28px;
    }

    .login-card h2{
        font-size: 1.8rem;
        font-weight: 900;
        color: #000000;
        margin-bottom: 4px;
        text-align: left;
    }

    .subtitle{
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #4b5563;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 24px;
    }

    .form-group{
        margin-bottom: 18px;
    }

    label{
        display: block;
        font-size: 0.85rem;
        font-weight: 900;
        color: #000000;
        margin-bottom: 6px;
        text-transform: uppercase;
    }

    input{
        width: 100%;
        height: 46px;
        padding: 0 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: #000000;
        background: #ffffff;
        border: 3px solid #000000;
        outline: none;
        box-shadow: 3px 3px 0px #000000;
    }

    input:focus{
        border-color: #f97316;
        box-shadow: 4px 4px 0px #f97316;
    }

    button{
        width: 100%;
        height: 48px;
        margin-top: 10px;
        background: #f97316;
        color: #000000;
        border: 3px solid #000000;
        font-size: 1rem;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 4px 4px 0px #000000;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button:hover{
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px #000000;
    }

    button:active{
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px #000000;
    }
</style>
</head>
<body>
    <section class="login-card">
        <form action="#" method="get">
            <h2>LOGIN PORTAL</h2>
            <p class="subtitle">Roshan Engineering Platform</p>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="roshan@example.com" required/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required/>
            </div>

            <button type="submit">SIGN IN NOW</button>
        </form>
    </section>
</body>
</html>
