<html>
    <head>
        <title>Roshan</title>
        <style>
            body{
                background: antiquewhite;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background-image: linear-gradient(black 2px, transparent 1px), linear-gradient(90deg, black 2px, transparent 1px);
                background-size: 40px 40px;
            }
            .navbar {
                
                width: 100%;
                box-sizing: border-box;
                padding: 20px 40px;
                background-color: #facc15;
                border-bottom: 4px solid black;
                color: black;
                font-size: 24px;
                font-weight: bold;
                text-align: center;
            }
            .footer {
                width: 100%;
                box-sizing: border-box;
                padding: 20px 40px;
                background-color: #facc15;
                border-top: 4px solid black;
                color: black;
                font-size: 24px;
                font-weight: bold;
                text-align: center;
            }
            .container{
                width: min(90%, 420px);
                box-sizing: border-box;
                margin: auto;
                padding: 35px;
                background-color: white;
                border: 4px solid black;
                box-shadow: 8px 8px 0 black;
                border-radius: 0;
                display: flex;
                flex-direction: column;
            }
            .form {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            h1, h3 {
                color: black;
                margin: 5px 0;
            }
            h3 {
                align-self: flex-start;
                text-transform: uppercase;
            }
            input {
                width: 100%;
                box-sizing: border-box;
                padding: 11px;
                border: 3px solid black;
                border-radius: 0;
                font-size: 15px;
                box-shadow: 4px 4px 0 black;
            }
            input:focus {
                outline: none;
                border-color: black;
            }
            button {
                margin-top: 12px;
                padding: 11px 28px;
                border: 3px solid black;
                box-shadow: 4px 4px 0 black;
                background-color: #facc15;
                color: black;
                font-weight: bold;
                cursor: pointer;
                transition: transform 0.1s ease, box-shadow 0.1s ease;
            }
            button:active {
                transform: translate(4px, 4px);
                box-shadow: 0 0 0 black;
            }
        </style>
    </head>
    <body>
        <nav class="navbar">Header</nav>
        <div class="container">
            <div class="form">
                <h1>Form</h1>
                <h3>Section</h3>
                <input id="input" placeholder="Enter Your Class">
                <h3 id="roll">Roll No.</h3>
                <input id="input" placeholder="Enter your Rollno.">
                <h3 id="name">Name</h3>
                <input id="input" placeholder="Enter your name">
                <button>SUBMIT</button>
            </div>
        </div>
        <footer class="footer">Footer</footer>
    </body>
</html>
