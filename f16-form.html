<html>
    <head>
        <title>Roshan</title>
        <style>
            body{
                background: antiquewhite;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background-image: linear-gradient(black 2px, transparent 1px), linear-gradient(90deg, black 2px, transparent 1px);
                background-size: 40px 40px;
            }
            .navbar {
                
                width: 100%;
                box-sizing: border-box;
                padding: 20px 40px;
                background-color: #facc15;
                border-bottom: 4px solid black;
                color: black;
                font-size: 24px;
                font-weight: bold;
                text-align: center;
            }
            .footer {
                width: 100%;
                box-sizing: border-box;
                padding: 20px 40px;
                background-color: #facc15;
                border-top: 4px solid black;
                color: black;
                font-size: 24px;
                font-weight: bold;
                text-align: center;
            }
            .container{
                width: min(90%, 420px);
                box-sizing: border-box;
                margin: auto;
                padding: 35px;
                background-color: white;
                border: 4px solid black;
                box-shadow: 8px 8px 0 black;
                border-radius: 0;
                display: flex;
                flex-direction: column;
            }
            .form {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            h1, h3 {
                color: black;
                margin: 5px 0;
            }
            h3 {
                align-self: flex-start;
                text-transform: uppercase;
            }
            input {
                width: 100%;
                box-sizing: border-box;
                padding: 11px;
                border: 3px solid black;
                border-radius: 0;
                font-size: 15px;
                box-shadow: 4px 4px 0 black;
            }
            input:focus {
                outline: none;
                border-color: black;
            }
            button {
                margin-top: 12px;
                padding: 11px 28px;
                border: 3px solid black;
                box-shadow: 4px 4px 0 black;
                background-color: #facc15;
                color: black;
                font-weight: bold;
                cursor: pointer;
                transition: transform 0.1s ease, box-shadow 0.1s ease;
            }
            button:active {
                transform: translate(4px, 4px);
                box-shadow: 0 0 0 black;
            }
            #message {
                margin-top: 18px;
                font-weight: bold;
                text-align: center;
            }
            .error { color: #b91c1c; }
            .success { color: #166534; }
        </style>
    </head>
    <body>
        <nav class="navbar">Header</nav>
        <div class="container">
            <form class="form">
                <h1>Form</h1>
                <h3>Section</h3>
                <input id="section" placeholder="Enter Your Class">
                <h3 id="roll">Roll No.</h3>
                <input id="rollNo" placeholder="Enter your Rollno." inputmode="numeric">
                <h3 id="name">Name</h3>
                <input id="studentName" placeholder="Enter your name">
                <button type="submit">SUBMIT</button>
                <p id="message" role="alert"></p>
            </form>
        </div>
        <footer class="footer">Footer</footer>
        <script>
            document.querySelector('.form').addEventListener('submit', function (event) {
                event.preventDefault();
                const section = document.getElementById('section').value.trim();
                const rollNo = document.getElementById('rollNo').value.trim();
                const studentName = document.getElementById('studentName').value.trim();
                const message = document.getElementById('message');

                if (!section) {
                    message.textContent = 'Section not written. Please enter your section.';
                    message.className = 'error';
                    return;
                }
                if (!rollNo) {
                    message.textContent = 'Roll number not written. Please enter your roll number.';
                    message.className = 'error';
                    return;
                }
                if (!/^\d+$/.test(rollNo)) {
                    message.textContent = 'Roll number must contain digits only.';
                    message.className = 'error';
                    return;
                }
                if (!studentName) {
                    message.textContent = 'Name not written. Please enter your name.';
                    message.className = 'error';
                    return;
                }
                message.textContent = 'Details submitted successfully.';
                message.className = 'success';
            });
        </script>
    </body>
</html>
