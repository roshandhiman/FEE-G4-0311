<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roshan - Flex Layout 01</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Arial Black', -apple-system, sans-serif;
    background: #fff7ed;
    color: #000000;
}

header{
    background: #f97316;
    color: #000000;
    padding: 18px 30px;
    font-size: 22px;
    font-weight: 900;
    border-bottom: 4px solid #000000;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.badge{
    background: #ffffff;
    border: 3px solid #000000;
    padding: 4px 12px;
    font-size: 14px;
    box-shadow: 3px 3px 0px #000000;
}

main{
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.container{
    display: grid;
    grid-template-columns: repeat(2, 190px);
    column-gap: 24px;
    row-gap: 24px;
}

.box{
    width: 190px;
    height: 150px;
    background: #ffffff;
    color: #000000;
    border: 4px solid #000000;
    box-shadow: 6px 6px 0px #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: 900;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
}

.box:hover{
    transform: translate(-3px, -3px);
    box-shadow: 9px 9px 0px #f97316;
}

.box-1{ background: #fed7aa; }
.box-2{ background: #ffffff; }
.box-3{ background: #fdba74; }
.box-4{ background: #ffedd5; }

footer{
    background: #ffffff;
    color: #000000;
    border-top: 4px solid #000000;
    padding: 16px 30px;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
}
</style>
</head>
<body>

<header>
    <div>ROSHAN • FLEX SYSTEM</div>
    <div class="badge">NEO-BRUTALISM</div>
</header>

<main>
    <div class="container">
        <div class="box box-1">BOX 01</div>
        <div class="box box-2">BOX 02</div>
        <div class="box box-3">BOX 03</div>
        <div class="box box-4">BOX 04</div>
    </div>
</main>

<footer>
    ROSHAN LAB ASSIGNMENT 01 • ALL RIGHTS RESERVED
</footer>

</body>
</html>
