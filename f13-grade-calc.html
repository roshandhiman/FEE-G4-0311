<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Grade & Attendance Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #fff7ed;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Arial Black', -apple-system, sans-serif;
        }

        .calc-card {
            background: #ffffff;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0px #000000;
            width: 100%;
            max-width: 440px;
            padding: 32px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 4px;
            text-align: left;
        }

        .subtitle {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #4b5563;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 900;
            color: #000000;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #000000;
            background: #ffffff;
            border: 3px solid #000000;
            outline: none;
            box-shadow: 3px 3px 0px #000000;
        }

        input:focus {
            border-color: #f97316;
            box-shadow: 4px 4px 0px #f97316;
        }

        button {
            width: 100%;
            height: 46px;
            margin-top: 10px;
            background: #f97316;
            color: #000000;
            border: 3px solid #000000;
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #fed7aa;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            display: none;
            text-align: center;
        }

        .result-title {
            font-size: 0.8rem;
            color: #000000;
            margin-bottom: 4px;
            font-weight: 900;
        }

        .result-value {
            font-size: 1.05rem;
            font-weight: 900;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="calc-card">
        <h2>GRADE & ATTENDANCE</h2>
        <p class="subtitle">Roshan ES Module Interactive Demo</p>

        <div class="form-group">
            <label for="totalDays">Total Days</label>
            <input type="number" id="totalDays" placeholder="100" value="100">
        </div>

        <div class="form-group">
            <label for="presentDays">Present Days</label>
            <input type="number" id="presentDays" placeholder="85" value="85">
        </div>

        <div class="form-group">
            <label for="marks">Marks Obtained</label>
            <input type="number" id="marks" placeholder="92" value="92">
        </div>

        <button onclick="calculate()">COMPUTE RESULT</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">COMPUTED OUTPUT:</div>
            <div class="result-value" id="resultText"></div>
        </div>
    </div>

    <script>
        function grade(marks) {
            if (marks >= 90) return 'A';
            if (marks >= 80) return 'B';
            if (marks >= 70) return 'C';
            if (marks >= 60) return 'D';
            return 'F';
        }

        function attendance(tDays, pDays) {
            let x = (pDays / tDays) * 100;
            return x.toFixed(2);
        }

        function calculate() {
            const tDays = Number(document.getElementById('totalDays').value);
            const pDays = Number(document.getElementById('presentDays').value);
            const m = Number(document.getElementById('marks').value);

            if (!tDays || !pDays || isNaN(m)) {
                alert('Please enter valid numbers');
                return;
            }

            const att = attendance(tDays, pDays);
            const g = grade(m);
            const msg = `Grade is ${g} and attendance is ${att}%`;

            document.getElementById('resultText').innerText = msg;
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
