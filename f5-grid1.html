<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Roshan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Minimalist Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body{
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-box{
            background: #ffffff;
            border-bottom: 2px solid #f97316;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .grid-container{
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(3, 140px);
            grid-template-rows: repeat(3, 140px);
            place-content: center;
            padding: 32px;
            flex: 1;
        }

        .grid-item{
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 15px;
            color: #0f172a;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .grid-item:hover{
            border-color: #f97316;
            background: #fff7ed;
            color: #ea580c;
        }

        @media (min-width: 767px){
            .grid-container{
                grid-template-columns: repeat(3, 190px);
                grid-template-rows: repeat(2, 160px);
            }
        }

        @media (min-width: 1024px){
            .grid-container{
                grid-template-columns: repeat(4, 210px);
                grid-template-rows: repeat(2, 160px);
            }

            #m6{
                grid-column: 2 / -1;
                background: #fff7ed;
                border-color: #f97316;
                color: #ea580c;
            }
        }

        .footer-box{
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 16px 32px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <header class="header-box">
        <div>ROSHAN • MINIMAL GRID</div>
        <span style="color: #f97316; font-size: 13px; font-weight: 700;">RESPONSIVE TILES</span>
    </header>

    <main class="grid-container">
        <div class="grid-item" id="m1">Tile 01</div>
        <div class="grid-item" id="m2">Tile 02</div>
        <div class="grid-item" id="m3">Tile 03</div>
        <div class="grid-item" id="m4">Tile 04</div>
        <div class="grid-item" id="m5">Tile 05</div>
        <div class="grid-item" id="m6">Tile 06 (Wide Span)</div>
    </main>

    <footer class="footer-box">
        Roshan Lab Assignment 05 • Minimalist System
    </footer>
</body>
</html>
