<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Roshan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Bento Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body{
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #09090b;
            color: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-box{
            background: #18181b;
            border-bottom: 1px solid #27272a;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .bento-container{
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            place-content: center;
            padding: 24px;
            flex: 1;
        }

        .bento-item{
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e4e4e7;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .bento-item:hover{
            border-color: #f97316;
            color: #ffffff;
        }

        #m1{
            grid-column: 1 / 3;
            grid-row: 1 / 2;
            background: #1c1917;
            border-color: #44403c;
            color: #fdba74;
        }

        #m2{
            grid-column: 3 / 4;
            grid-row: 1 / 3;
            background: #18181b;
        }

        #m3{
            grid-column: 1 / 2;
            grid-row: 2 / 4;
            background: #18181b;
        }

        #m4{
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            background: #18181b;
        }

        #m5{
            grid-column: 2 / 4;
            grid-row: 3 / 4;
            background: #1c1917;
            border-color: #44403c;
            color: #f97316;
        }

        @media (min-width: 640px){
            .bento-container{
                grid-template-columns: repeat(3, 150px);
                grid-template-rows: repeat(3, 120px);
            }
        }

        @media (min-width: 1024px){
            .bento-container{
                grid-template-columns: repeat(3, 220px);
                grid-template-rows: repeat(3, 140px);
            }
        }

        .footer-box{
            background: #18181b;
            border-top: 1px solid #27272a;
            padding: 14px 32px;
            text-align: center;
            font-size: 13px;
            color: #71717a;
        }
    </style>
</head>
<body>
    <header class="header-box">
        <div>ROSHAN • BENTO GRID</div>
        <span style="color: #f97316; font-size: 12px; font-weight: 700;">MATTE DARK</span>
    </header>

    <main class="bento-container">
        <div class="bento-item" id="m1">Bento Header 01</div>
        <div class="bento-item" id="m2">Bento Vertical 02</div>
        <div class="bento-item" id="m3">Bento Column 03</div>
        <div class="bento-item" id="m4">Bento Center 04</div>
        <div class="bento-item" id="m5">Bento Span 05</div>
    </main>

    <footer class="footer-box">
        Roshan Lab Assignment 06 • Bento Grid Layout
    </footer>
</body>
</html>
