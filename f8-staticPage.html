<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Responsive Showcase</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1120 0%, #1e1b4b 50%, #0f172a 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        .p{
            padding: 1.5rem;
        }

        section{
            width: 100%;
        }

        .box{
            width: 100%;
            height: 7.5rem;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .card{
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            color: #f8fafc;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .card:hover{
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.6);
        }

        .fc1{
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            padding: 2.5rem 1.5rem;
        }

        .fc2{
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 1.5rem;
        }

        #s1{
            max-width: 600px;
        }

        #s2{
            max-width: 900px;
        }

        @media screen and (max-width: 768px){
            .fc2{
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <section class="p fc1">
        <section class="fc2" id="s1">
            <div class="p box card">Roshan Hero Highlight</div>
        </section>
        <section class="fc2" id="s2">
            <div class="p box card">Roshan Portfolio</div>
            <div class="p box card">Roshan Analytics</div>
            <div class="p box card">Roshan Cloud</div>
        </section>
    </section>
</body>
</html>
