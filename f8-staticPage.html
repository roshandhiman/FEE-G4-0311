<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan - Responsive Showcase</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            min-height: 100vh;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #0f172a;
        }

        .p{
            padding: 1.5rem;
        }

        section{
            width: 100%;
        }

        .box{
            width: 100%;
            height: 7.5rem;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            font-weight: 700;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            color: #0f172a;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .box:hover{
            border-color: #f97316;
            transform: translateY(-2px);
        }

        .hero-box{
            background: #fff7ed;
            border-color: #f97316;
            color: #ea580c;
            font-size: 1.2rem;
        }

        .fc1{
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            padding: 2.5rem 1.5rem;
        }

        .fc2{
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 1.5rem;
        }

        #s1{
            max-width: 600px;
        }

        #s2{
            max-width: 900px;
        }

        @media screen and (max-width: 768px){
            .fc2{
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <section class="p fc1">
        <section class="fc2" id="s1">
            <div class="p box hero-box">Roshan Hero Highlight • Showcase</div>
        </section>
        <section class="fc2" id="s2">
            <div class="p box">Analytics Module</div>
            <div class="p box">Components Hub</div>
            <div class="p box">System Metrics</div>
        </section>
    </section>
</body>
</html>
